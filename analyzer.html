<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Анализатор смеха Telegram</title>
  <style>
    :root {
      --bg: #100c15;
      --panel: rgba(255,255,255,.075);
      --text: #fff9f5;
      --muted: #cbbfd0;
      --line: rgba(255,255,255,.13);
      --pink: #ff80a5;
      --peach: #ffc08d;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 8% 0%,rgba(185,154,255,.19),transparent 30%),
        radial-gradient(circle at 92% 8%,rgba(255,128,165,.19),transparent 30%),
        linear-gradient(180deg,#100c15,#18101d);
    }
    main { width:min(900px,calc(100% - 24px)); margin:0 auto; padding:40px 0 70px; }
    .panel {
      padding:clamp(22px,5vw,48px);
      border:1px solid var(--line);
      border-radius:30px;
      background:var(--panel);
      backdrop-filter:blur(18px);
    }
    h1 { font-size:clamp(36px,7vw,66px); line-height:1; letter-spacing:-.05em; margin:0 0 16px; }
    h2 { margin-top:34px; }
    p { color:var(--muted); line-height:1.6; }
    label { display:block; margin:18px 0 7px; font-weight:700; }
    input,select {
      width:100%;
      padding:13px 14px;
      color:var(--text);
      background:rgba(255,255,255,.06);
      border:1px solid var(--line);
      border-radius:15px;
      font:inherit;
    }
    option { color:#111; }
    .drop {
      margin-top:24px;
      padding:32px 18px;
      text-align:center;
      border:1px dashed rgba(255,255,255,.25);
      border-radius:22px;
      background:rgba(255,255,255,.035);
    }
    button {
      margin-top:15px;
      border:0;
      border-radius:999px;
      padding:13px 18px;
      cursor:pointer;
      color:#28141e;
      font:inherit;
      font-weight:800;
      background:linear-gradient(100deg,var(--pink),var(--peach));
    }
    button[disabled] { opacity:.45; cursor:not-allowed; }
    .status { margin-top:15px; min-height:24px; color:#ffd7e2; font-weight:700; }
    .results { display:grid; gap:12px; margin-top:20px; }
    .row {
      display:grid;
      grid-template-columns:145px 1fr 55px;
      gap:12px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .track { height:12px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.08); }
    .fill { height:100%; background:linear-gradient(90deg,var(--pink),var(--peach)); border-radius:inherit; }
    .examples { margin-top:8px; color:var(--muted); font-size:13px; line-height:1.5; }
    .privacy {
      margin-top:22px;
      padding:15px 17px;
      border-radius:18px;
      background:rgba(255,128,165,.07);
      border:1px solid rgba(255,128,165,.18);
      color:#f6e9f1;
      line-height:1.5;
    }
    @media(max-width:540px) {
      .row { grid-template-columns:90px 1fr 38px; gap:8px; }
      main { padding-top:15px; }
    }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <h1>Анализатор смеха Telegram</h1>
    <p>
      Загрузи файл <code>result.json</code>, выбери девушку в списке авторов
      и скачай готовый <code>laugh_data.js</code> для сайта.
    </p>

    <div class="privacy">
      Файл обрабатывается прямо в этом браузере. Переписка не загружается на сервер
      и никуда не отправляется.
    </div>

    <div class="drop">
      <label for="jsonFile">JSON-экспорт чата</label>
      <input id="jsonFile" type="file" accept=".json,application/json">
    </div>

    <label for="authorSelect">Чьи сообщения анализировать</label>
    <select id="authorSelect" disabled>
      <option>Сначала выбери файл</option>
    </select>

    <button id="analyzeButton" disabled>Посчитать виды смеха</button>
    <div class="status" id="status" aria-live="polite"></div>

    <div id="resultSection" hidden>
      <h2>Результаты</h2>
      <div class="results" id="results"></div>
      <button id="downloadButton">Скачать laugh_data.js</button>
    </div>
  </section>
</main>

<script>
  const fileInput = document.getElementById("jsonFile");
  const authorSelect = document.getElementById("authorSelect");
  const analyzeButton = document.getElementById("analyzeButton");
  const downloadButton = document.getElementById("downloadButton");
  const status = document.getElementById("status");
  let messages = [];
  let finalData = [];

  const categories = [
    {
      label: "длинное ахахах",
      note: "Особо сильная реакция",
      patterns: [/(?:ах){4,}а?/giu, /а?ха(?:ха){3,}/giu]
    },
    {
      label: "сломанный смех",
      note: "хпхпх, пхпх и потеря контроля",
      patterns: [/(?:хп|пх){2,}/giu, /(?=[ахп]*х)(?=[ахп]*п)[ахп]{4,}/giu]
    },
    {
      label: "ахаха",
      note: "Базовое одобрение шутки",
      patterns: [/(?:ах){2,3}а?/giu, /а?ха(?:ха){1,2}/giu]
    },
    {
      label: "хехе / хихи",
      note: "Сдержанная или хитрая реакция",
      patterns: [/хе(?:хе)+/giu, /хи(?:хи)+/giu]
    },
    {
      label: "ору / не могу",
      note: "Текстовое подтверждение последствий",
      patterns: [/\bору+\b/giu, /\bне\s+могу\b/giu, /\bвынесло\b/giu, /\bв\s+голос\b/giu, /\bумираю\b/giu, /\bя\s+умер(?:ла)?\b/giu]
    },
    {
      label: "😂 / 🤣",
      note: "Международный протокол смеха",
      patterns: [/[😂🤣]+/gu]
    },
    {
      label: "lol / lmao",
      note: "Англоязычная версия",
      patterns: [/\b(?:lol|lmao|rofl)\b/giu]
    }
  ];

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;

    status.textContent = "Читаю экспорт…";
    document.getElementById("resultSection").hidden = true;

    try {
      const data = JSON.parse(await file.text());
      messages = extractMessages(data);

      if (!messages.length) {
        throw new Error("Не удалось найти массив сообщений в этом JSON.");
      }

      const authors = [...new Set(
        messages
          .map(message => String(message.from || "").trim())
          .filter(Boolean)
      )].sort((a,b) => a.localeCompare(b,"ru"));

      authorSelect.innerHTML = authors
        .map(author => `<option value="${escapeHtml(author)}">${escapeHtml(author)}</option>`)
        .join("");

      authorSelect.disabled = authors.length === 0;
      analyzeButton.disabled = authors.length === 0;
      status.textContent = `Найдено сообщений: ${messages.length}. Выбери автора.`;
    } catch (error) {
      messages = [];
      authorSelect.disabled = true;
      analyzeButton.disabled = true;
      status.textContent = `Ошибка: ${error.message}`;
    }
  });

  analyzeButton.addEventListener("click", () => {
    const author = authorSelect.value;
    const selectedMessages = messages.filter(
      message => String(message.from || "").trim() === author && message.type === "message"
    );

    const counts = new Map(categories.map(category => [
      category.label,
      { label: category.label, value: 0, note: category.note, examples: [] }
    ]));

    selectedMessages.forEach(message => {
      let remaining = flattenText(message.text).toLowerCase().replaceAll("ё","е");
      if (!remaining) return;

      categories.forEach(category => {
        let found = false;

        category.patterns.forEach(pattern => {
          pattern.lastIndex = 0;
          if (pattern.test(remaining)) found = true;
          pattern.lastIndex = 0;
          remaining = remaining.replace(pattern, " ");
        });

        if (found) {
          const item = counts.get(category.label);
          item.value += 1;
          if (item.examples.length < 3) {
            item.examples.push(flattenText(message.text).slice(0,180));
          }
        }
      });
    });

    finalData = [...counts.values()]
      .filter(item => item.value > 0)
      .sort((a,b) => b.value - a.value);

    renderResults(finalData);
    status.textContent =
      `Проанализировано сообщений автора «${author}»: ${selectedMessages.length}.`;
    document.getElementById("resultSection").hidden = false;
  });

  downloadButton.addEventListener("click", () => {
    const clean = finalData.map(({label,value,note}) => ({label,value,note}));
    const content =
      "window.LAUGH_DATA = " + JSON.stringify(clean,null,2) + ";\n";
    const blob = new Blob([content], { type: "text/javascript;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "laugh_data.js";
    link.click();
    URL.revokeObjectURL(url);
  });

  function extractMessages(data) {
    if (Array.isArray(data.messages)) return data.messages;

    const chats = data?.chats?.list;
    if (Array.isArray(chats)) {
      return chats.flatMap(chat => Array.isArray(chat.messages) ? chat.messages : []);
    }

    return [];
  }

  function flattenText(value) {
    if (typeof value === "string") return value;
    if (!Array.isArray(value)) return "";

    return value.map(item => {
      if (typeof item === "string") return item;
      if (item && typeof item === "object") return String(item.text || "");
      return "";
    }).join("");
  }

  function renderResults(items) {
    const results = document.getElementById("results");
    const max = Math.max(...items.map(item => item.value),1);

    results.innerHTML = items.map(item => `
      <div>
        <div class="row">
          <strong>${escapeHtml(item.label)}</strong>
          <div class="track"><div class="fill" style="width:${item.value / max * 100}%"></div></div>
          <div>${item.value}</div>
        </div>
        <div class="examples">
          ${item.examples.length ? "Примеры: " + item.examples.map(escapeHtml).join(" · ") : ""}
        </div>
      </div>
    `).join("");
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
</script>
</body>
</html>
